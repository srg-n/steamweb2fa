name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir frontend install --no-frozen-lockfile
      - name: Audit dependencies
        # Supply chain is the remaining XSS vector, so a known-vulnerable
        # package in the shipped bundle must fail the build. Dev-only advisories
        # (build tooling) are reported by the next step but do not block, since
        # they never reach a user's browser.
        run: pnpm --dir frontend audit --prod --audit-level=high
      - name: Audit dev dependencies (informational)
        if: always()
        run: pnpm --dir frontend audit --audit-level=critical || true
      - name: Lint
        run: pnpm --dir frontend lint
      - name: Test
        run: pnpm --dir frontend test
      - name: Build Single-File App
        run: pnpm --dir frontend build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
